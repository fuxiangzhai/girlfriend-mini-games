<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a112c">
    <meta name="description" content="轻轻点一颗，听它啪地破掉。">
    <title>捏泡泡纸 · 女友小游戏</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./assets/game.css">
    <link rel="stylesheet" href="./assets/arcade.css">
    <script type="module" src="./assets/bubble-wrap.js"></script>
  </head>
  <body class="bubble-page">
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="./" aria-label="女友小游戏首页">
          <span class="brand-mark" aria-hidden="true">♥</span>
          <span><strong>女友小游戏</strong><small>PAT PAT CLUB</small></span>
        </a>
        <nav class="game-nav" aria-label="切换游戏">
          <a href="./slap.html">隔空拍脸</a>
          <a href="./bubble-wrap.html" aria-current="page">捏泡泡纸</a>
          <a href="./memory.html">翻牌配对</a>
          <a href="./catch-stars.html">接星星</a>
        </nav>
        <button class="button sound-button" type="button" id="sound" aria-label="游戏音效" aria-pressed="true">
          <span class="sound-note" aria-hidden="true">♪</span><span id="sound-label" aria-hidden="true">音效开</span>
        </button>
      </div>
    </header>
    <main class="wrap arcade-game">
      <section class="intro" aria-labelledby="title">
        <h1 id="title">捏<span>泡泡纸</span></h1>
        <p>轻轻点一颗，听它啪地破掉。</p>
      </section>
      <div class="game-grid">
        <section class="cabinet" aria-label="泡泡纸游戏">
          <div class="arcade-screen bubble-screen">
            <p class="sr-only" id="bubble-keys">用方向键移动，按空格捏爆气泡。</p>
            <div id="bubble-sheet" class="bubble-sheet" role="group" aria-label="一张泡泡纸" aria-describedby="bubble-keys"></div>
          </div>
        </section>
        <aside class="sidebar" aria-label="本张进度">
          <section class="score-card activity-score">
            <h2>捏爆进度</h2>
            <p class="activity-count"><strong id="bubble-count">00</strong><span> / 36</span></p>
            <progress id="bubble-progress" aria-label="捏爆进度" value="0" max="36"></progress>
            <p class="activity-status" id="bubble-status" role="status"></p>
            <button type="button" class="button activity-button" id="new-sheet" disabled>换一张泡泡纸</button>
          </section>
        </aside>
      </div>
    </main>
  </body>
</html>
