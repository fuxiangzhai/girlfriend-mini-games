<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a112c">
    <meta name="description" content="手机即开的解压游戏合集。隔空拍脸、捏泡泡纸、翻牌配对和接星星。">
    <title>女友小游戏</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./assets/game.css">
    <link rel="stylesheet" href="./assets/arcade.css">
  </head>
  <body class="arcade-home">
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="./" aria-label="女友小游戏首页" aria-current="page">
          <span class="brand-mark" aria-hidden="true">♥</span>
          <span><strong>女友小游戏</strong><small>PAT PAT CLUB</small></span>
        </a>
        <nav class="game-nav" aria-label="切换游戏">
          <a href="./slap.html">隔空拍脸</a>
          <a href="./bubble-wrap.html">捏泡泡纸</a>
          <a href="./memory.html">翻牌配对</a>
          <a href="./catch-stars.html">接星星</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <section class="intro arcade-intro" aria-labelledby="title">
        <div class="eyebrow"><span aria-hidden="true">✦</span> 给她的解压街机</div>
        <h1 id="title">女友<span>小游戏</span></h1>
        <p>挑一款，放松一会儿。</p>
      </section>
      <div class="game-collection">
        <a class="game-card slap-card" href="./slap.html">
          <div class="game-card-art slap-art" aria-hidden="true">
            <img src="./assets/avatar.jpg" alt="" width="1279" height="1279">
            <span class="art-impact">啪！</span>
          </div>
          <div class="game-card-copy"><h2>隔空拍脸</h2><p>挥挥手，或者直接点头像。</p></div>
        </a>
        <a class="game-card bubble-card" href="./bubble-wrap.html">
          <div class="game-card-art bubble-art" aria-hidden="true">
            <div class="mini-sheet"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="game-card-copy"><h2>捏泡泡纸</h2><p>一颗一颗捏，听它啪地破掉。</p></div>
        </a>
        <a class="game-card memory-card" href="./memory.html">
          <div class="game-card-art memory-art" aria-hidden="true"><span>🍓</span><span>🍓</span></div>
          <div class="game-card-copy"><h2>翻牌配对</h2><p>找出一样的水果，两两配对。</p></div>
        </a>
        <a class="game-card stars-card" href="./catch-stars.html">
          <div class="game-card-art stars-art" aria-hidden="true"><span>✦</span><span>★</span><span>✧</span><i></i></div>
          <div class="game-card-copy"><h2>接星星</h2><p>移动篮子，接住落下的星星。</p></div>
        </a>
      </div>
    </main>
  </body>
</html>
