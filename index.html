<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a112c">
    <meta name="description" content="给她的解压小游戏。开摄像头挥挥手，或者直接点击，拍到开心就好。">
    <title>隔空拍脸 · 拍拍俱乐部</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./assets/game.css">
    <script type="module" src="./assets/game.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✋</span>
          <div><strong>拍拍俱乐部</strong><small>PAT PAT CLUB</small></div>
        </div>
        <button class="button sound-button" type="button" id="sound" aria-label="游戏音效" aria-pressed="true">
          <span class="sound-note" aria-hidden="true">♪</span><span id="sound-label" aria-hidden="true">音效开</span>
        </button>
      </div>
    </header>

    <main class="wrap">
      <section class="intro" aria-labelledby="title">
        <div class="eyebrow"><span aria-hidden="true">✦</span> 给她的解压街机</div>
        <h1 id="title">隔空<span>拍脸</span>！</h1>
        <p>今天的气，先交给屏幕里的我。</p>
      </section>

      <div class="game-grid">
        <section class="cabinet" aria-label="游戏屏幕">
          <div class="stage" id="stage">
            <div class="star-field" aria-hidden="true"><b>✦</b><b>✷</b><b>✧</b><b>✦</b></div>
            <div class="stage-corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <div class="stage-meta">
              <span class="mode-tag" id="mode">点击模式</span>
            </div>
            <div class="target-zone">
              <div class="target-orbit" aria-hidden="true"></div>
              <div class="target-pose" id="pose">
                <button class="target" id="target" type="button" aria-label="拍一下头像" aria-describedby="stage-hint">
                  <img src="./assets/mascot.png" id="face" alt="" width="1254" height="1254" draggable="false">
                </button>
              </div>
            </div>
            <div class="camera-preview" id="camera-preview" hidden>
              <div class="camera-feed" id="camera-feed">
                <video id="camera-video" playsinline muted></video>
                <canvas id="skeleton" aria-hidden="true"></canvas>
              </div>
              <div class="camera-preview-label"><span aria-hidden="true"></span>摄像头预览</div>
            </div>
            <div class="effects" id="effects" aria-hidden="true"></div>
            <div class="stage-hint" id="stage-hint">点击头像，先拍一下！</div>
          </div>
          <div class="controlbar">
            <button type="button" class="button camera-button" id="camera" aria-pressed="false">
              <span class="camera-icon" aria-hidden="true"></span><span id="camera-label">开启摄像头</span>
            </button>
            <div class="photo-controls">
              <button type="button" class="button photo-button" id="photo-button">
                <span class="photo-icon" aria-hidden="true"></span>换我的照片
              </button>
              <input type="file" id="photo-input" accept="image/*" hidden>
              <button type="button" class="undo-button" id="undo-photo" hidden>恢复默认头像</button>
            </div>
          </div>
          <p class="feedback" id="feedback" role="status" hidden></p>
        </section>

        <aside class="sidebar" aria-label="战绩和玩法">
          <section class="score-card">
            <div class="card-heading">
              <h2>本局战绩</h2>
              <button class="reset-button" id="reset" type="button" disabled><span aria-hidden="true">↻</span> 重置</button>
            </div>
            <div class="score-grid">
              <div><span class="metric">拍中次数</span><strong class="score" id="hits">00</strong></div>
              <div><span class="metric">最高连击</span><strong class="score score-combo"><span aria-hidden="true">×</span><span id="best">0</span></strong></div>
            </div>
          </section>
          <section class="help-card">
            <h2>怎么玩？</h2>
            <div class="rule">
              <span class="rule-icon rule-camera" aria-hidden="true">✋</span>
              <div><h3>挥手拍</h3><p>开启摄像头，手掌张开对着镜头，快速扫过画面中间。</p></div>
            </div>
            <div class="rule">
              <span class="rule-icon rule-touch" aria-hidden="true">☛</span>
              <div><h3>点击拍</h3><p>直接点头像。连续拍中就能叠加连击。</p></div>
            </div>
          </section>
        </aside>
      </div>
      <footer class="footer">
        <span class="lock-icon" aria-hidden="true"></span>照片和摄像头画面均在你的设备上处理。
      </footer>
    </main>
  </body>
</html>
